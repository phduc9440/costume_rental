# ============================================
# Costume Service — OpenAPI 3.0 Specification
# ============================================
openapi: 3.0.3
info:
  title: Costume Service API
  description: |
    API quản lý trang phục và kho hàng cho hệ thống cho thuê trang phục.
    Bao gồm: CRUD trang phục, cập nhật số lượng kho, thống kê doanh thu theo trang phục.
  version: 1.0.0

servers:
  - url: http://localhost:8080/costume
    description: Via API Gateway
  - url: http://localhost:5002
    description: Direct access (development)

paths:
  # ─── Costume Management ────────────────────
  /costumes:
    post:
      tags: [Costume]
      summary: Tạo trang phục mới
      operationId: createCostume
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CostumeCreationRequest'
      responses:
        '201':
          description: Tạo thành công
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseCostumeResponse'
        '400':
          description: Dữ liệu không hợp lệ

    get:
      tags: [Costume]
      summary: Lấy danh sách trang phục (phân trang hoặc theo danh sách IDs)
      operationId: getCostumes
      parameters:
        - name: ids
          in: query
          description: Danh sách IDs trang phục (nếu muốn lấy theo list)
          required: false
          schema:
            type: array
            items:
              type: string
        - name: page
          in: query
          required: false
          schema:
            type: integer
            default: 1
        - name: size
          in: query
          required: false
          schema:
            type: integer
            default: 10
      responses:
        '200':
          description: Thành công
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/ApiResponsePageCostumeResponse'
                  - $ref: '#/components/schemas/ApiResponseCostumeResponseList'

  /costumes/{id}:
    get:
      tags: [Costume]
      summary: Lấy thông tin trang phục theo ID
      operationId: getCostumeById
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Thành công
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseCostumeResponse'
        '404':
          description: Không tìm thấy trang phục
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseError'

    put:
      tags: [Costume]
      summary: Cập nhật thông tin trang phục
      operationId: updateCostume
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CostumeUpdateRequest'
      responses:
        '200':
          description: Cập nhật thành công
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseCostumeResponse'
        '404':
          description: Không tìm thấy trang phục

    delete:
      tags: [Costume]
      summary: Xóa trang phục
      operationId: deleteCostume
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Xóa thành công
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseVoid'

  /costumes/{id}/quantity:
    put:
      tags: [Costume]
      summary: Cập nhật số lượng tồn kho
      description: Thay đổi số lượng trang phục (tăng/giảm). Dùng cho Rental Service khi thuê/trả đồ.
      operationId: updateQuantity
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
        - name: quantityChange
          in: query
          description: Giá trị thay đổi (VD: -1 khi thuê, +1 khi trả)
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Cập nhật thành công
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseCostumeResponse'

  # ─── Statistics ─────────────────────────────
  /costumes/statistics/revenue:
    get:
      tags: [Statistics]
      summary: Thống kê doanh thu theo trang phục
      operationId: getCostumeRevenueStatistics
      responses:
        '200':
          description: Thành công
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseCostumeRevenueResponseList'

  # ─── Health Check ───────────────────────────
  /health:
    get:
      tags: [System]
      summary: Health check
      operationId: healthCheck
      responses:
        '200':
          description: Service is healthy
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: ok

# ─── Components ─────────────────────────────
components:
  schemas:

    # ── Request DTOs ──
    CostumeCreationRequest:
      type: object
      properties:
        name:
          type: string
          example: "Áo dài truyền thống"
        quantity:
          type: integer
          example: 10
        price:
          type: number
          format: float
          example: 150000.0

    CostumeUpdateRequest:
      type: object
      properties:
        name:
          type: string
          example: "Áo dài truyền thống - Red"
        quantity:
          type: integer
          example: 15
        price:
          type: number
          format: float
          example: 160000.0

    # ── Response DTOs ──
    CostumeResponse:
      type: object
      properties:
        id:
          type: string
          example: "costume-1"
        name:
          type: string
          example: "Áo dài truyền thống"
        quantity:
          type: integer
          example: 10
        price:
          type: number
          format: float
          example: 150000.0

    CostumeRevenueResponse:
      type: object
      properties:
        costumeId:
          type: string
          example: "costume-1"
        costumeName:
          type: string
          example: "Áo dài truyền thống"
        price:
          type: number
          format: float
          example: 150000.0
        totalRented:
          type: integer
          example: 25
        totalRevenue:
          type: number
          format: float
          example: 3750000.0

    # ── Page Response ──
    PageResponse:
      type: object
      properties:
        currentPage:
          type: integer
          example: 1
        totalPages:
          type: integer
          example: 5
        pageSize:
          type: integer
          example: 10
        totalElements:
          type: integer
          format: int64
          example: 45

    # ── Wrapped Responses ──
    ApiResponseCostumeResponse:
      type: object
      properties:
        code:
          type: integer
          example: 200
        message:
          type: string
          example: "Success"
        result:
          $ref: '#/components/schemas/CostumeResponse'

    ApiResponseCostumeResponseList:
      type: object
      properties:
        code:
          type: integer
          example: 200
        message:
          type: string
        result:
          type: array
          items:
            $ref: '#/components/schemas/CostumeResponse'

    ApiResponsePageCostumeResponse:
      type: object
      properties:
        code:
          type: integer
          example: 200
        message:
          type: string
        result:
          allOf:
            - $ref: '#/components/schemas/PageResponse'
            - type: object
              properties:
                data:
                  type: array
                  items:
                    $ref: '#/components/schemas/CostumeResponse'

    ApiResponseCostumeRevenueResponseList:
      type: object
      properties:
        code:
          type: integer
          example: 200
        message:
          type: string
          example: "Get costume revenue statistics success"
        result:
          type: array
          items:
            $ref: '#/components/schemas/CostumeRevenueResponse'

    ApiResponseVoid:
      type: object
      properties:
        code:
          type: integer
          example: 200
        message:
          type: string
          example: "Success"

    ApiResponseError:
      type: object
      properties:
        code:
          type: integer
          example: 9999
        message:
          type: string
          example: "Error message"
